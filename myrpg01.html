<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>技能樹不是用來點滿的</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>

  <!-- ① 首頁引導 -->
  <section id="intro">
    <h1>技能樹不是用來點滿的</h1>
    <p class="subtitle">
      有些選擇，本來就不能共存
    </p>
    <button id="start-btn">開始分配技能</button>
  </section>


  <!-- ② 技能樹主畫面 -->
  <main id="skill-tree" hidden>

    <!-- 技能樹容器 -->
    <section class="tree-container">

      <!-- 分支一：表現 / 成就 -->
      <div class="branch" data-branch="achievement">
        <h2>表現 / 成就</h2>

        <button class="skill-node" data-skill="grades">
          成績
        </button>

        <button class="skill-node" data-skill="admission">
          升學
        </button>

        <button class="skill-node" data-skill="recognition">
          被肯定
        </button>
      </div>

      <!-- 分支二：熱愛 / 自我 -->
      <div class="branch" data-branch="passion">
        <h2>熱愛 / 自我</h2>

        <button class="skill-node" data-skill="creation">
          創作
        </button>

        <button class="skill-node" data-skill="stage">
          舞台
        </button>

        <button class="skill-node" data-skill="freedom">
          自由
        </button>
      </div>

      <!-- 分支三：生存 / 代價 -->
      <div class="branch" data-branch="cost">
        <h2>生存 / 代價</h2>

        <button class="skill-node" data-skill="sleep">
          睡眠
        </button>

        <button class="skill-node" data-skill="emotion">
          情緒
        </button>

        <button class="skill-node" data-skill="relationships">
          關係
        </button>
      </div>

    </section>

    <!-- 技能點數顯示 -->
    <div id="skill-points">
      剩餘技能點：<span id="points">3</span>
    </div>

  </main>


  <!-- ③ 技能敘事面板（點技能後出現） -->
  <aside id="skill-panel" hidden>
    <h3 id="skill-title">技能名稱</h3>
    <p id="skill-description">
      技能的敘事文字會顯示在這裡。
    </p>
    <button id="close-panel">關閉</button>
  </aside>


  <!-- ④ 結算畫面 -->
  <section id="ending" hidden>
    <p class="ending-text">
      這不是選錯<br>
      是你被迫選擇
    </p>

    <p class="ending-subtext">
      如果這是一款遊戲<br>
      那它一開始就不是公平模式
    </p>
  </section>

</body>
</html>
