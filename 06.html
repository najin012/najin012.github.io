<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>認識常見心理狀態</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3efe9;
      color: #222;
      line-height: 1.8;
    }
    header {
      background: linear-gradient(135deg, #a68a64, #d6c7b2);
      color: white;
      padding: 3rem 2rem;
      text-align: center;
    }
    header h1 {
      margin-bottom: 0.5rem;
      font-size: 2.2rem;
    }
    header p {
      opacity: 0.9;
    }
    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem 3rem;
    }
    .accordion {
      border: 1px solid #d6c7b2;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      overflow: hidden;
      background: #fbf9f6;
    }
    .accordion-header {
      cursor: pointer;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      color: #6b5a44;
    }
    .accordion-header:hover {
      background: #f1ece4;
    }
    .accordion-header span {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .arrow {
      transition: transform 0.25s ease;
      display: inline-block;
    }
    .accordion.open .arrow {
      transform: rotate(90deg);
    }

    /* ⭐ 重點：Accordion 動畫 */
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      padding: 0 1.5rem;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      border-top: 1px solid #e6ddcf;
    }
    .accordion.open .accordion-content {
      opacity: 1;
      padding: 1.5rem;
    }

    .tag {
      display: inline-block;
      background: #e6ddcf;
      color: #6b5a44;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-right: 0.5rem;
    }
    .note {
      background: #efe8dc;
      border-left: 5px solid #a68a64;
      padding: 1rem 1.2rem;
      margin-top: 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>認識常見的心理狀態</h1>
    <p>焦慮、憂鬱、ADHD 與躁鬱症、思覺失調的基礎介紹</p>
  </header>

  <main>
    <!--（中間內容完全不變，略）-->
  </main>

  <footer>
    © 2025 心理健康資訊示範頁｜你並不孤單
  </footer>

  <script>
    const headers = document.querySelectorAll('.accordion-header');

    headers.forEach(header => {
      header.addEventListener('click', () => {
        const accordion = header.parentElement;
        const content = accordion.querySelector('.accordion-content');

        if (accordion.classList.contains('open')) {
          // 收起
          content.style.maxHeight = null;
          accordion.classList.remove('open');
        } else {
          // 展開
          accordion.classList.add('open');
          content.style.maxHeight = content.scrollHeight + 'px';
        }
      });
    });
  </script>
</body>
</html>
