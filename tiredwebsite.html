<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>如果網站也會累</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --fatigue: 0;
    }

    body {
      margin: 0;
      height: 200vh;
      font-family: "Noto Sans TC", system-ui, sans-serif;
      background: #111;
      color: #eee;
      transition: filter 0.3s, background 0.3s;
    }

    body.tired {
      filter: blur(1px) grayscale(40%);
      background: #0b0b0b;
    }

    .container {
      padding: 3rem;
      max-width: 700px;
      margin: auto;
      transform: rotate(calc(var(--fatigue) * 0.02deg));
      transition: transform 0.3s;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      line-height: 1.8;
      opacity: calc(1 - var(--fatigue) * 0.004);
    }

    button {
      margin-top: 2rem;
      padding: 0.8rem 1.5rem;
      background: #eee;
      color: #111;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.3s, transform 0.3s;
    }

    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .fatigue-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 6px;
      width: 100%;
      background: rgba(255,255,255,0.1);
    }

    .fatigue-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #aaa, #ff6b6b);
      transition: width 0.2s;
    }

    .message {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }

    .final {
      text-align: center;
      font-size: 1.4rem;
      margin-top: 5rem;
      opacity: 0;
      transition: opacity 1s;
    }

    .final.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="fatigue-bar">
    <div class="fatigue-fill" id="fatigueFill"></div>
  </div>

  <div class="container" id="container">
    <h1>如果網站也會累</h1>
    <p>
      你一直在滑，我一直在回應。  
      你以為我沒有感覺。
    </p>

    <p>
      但每一次滾動、每一次點擊，  
      都會留下痕跡。
    </p>

    <button id="actionBtn">再看一點</button>

    <div class="final" id="finalText">
      你看夠了，<br />我也是。
    </div>
  </div>

  <div class="message" id="message">疲勞值：0%</div>

  <script>
    let fatigue = 0;
    const maxFatigue = 100;

    const fill = document.getElementById("fatigueFill");
    const msg = document.getElementById("message");
    const btn = document.getElementById("actionBtn");
    const finalText = document.getElementById("finalText");

    function increaseFatigue(amount) {
      if (fatigue >= maxFatigue) return;

      fatigue = Math.min(maxFatigue, fatigue + amount);
      document.documentElement.style.setProperty("--fatigue", fatigue);
      fill.style.width = fatigue + "%";
      msg.textContent = `疲勞值：${fatigue}%`;

      if (fatigue > 60) {
        document.body.classList.add("tired");
      }

      if (fatigue >= 100) {
        btn.disabled = true;
        finalText.classList.add("show");
        msg.textContent = "疲勞值：滿了";
      }
    }

    // 滾動增加疲勞
    window.addEventListener("scroll", () => {
      increaseFatigue(0.3);
    });

    // 點擊按鈕增加疲勞
    btn.addEventListener("click", () => {
      increaseFatigue(5);
    });

    // 點擊任何地方也會增加
    document.addEventListener("click", (e) => {
      if (e.target !== btn) {
        increaseFatigue(1);
      }
    });
  </script>
</body>
</html>
