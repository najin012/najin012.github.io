      <h2>焦慮症</h2>
      <p>

      </p>
      <ul>
        <li>常見症狀：心悸、呼吸急促、過度擔心、失眠</li>
        <li>可能影響：學習、工作、人際關係</li>
      </ul>

      </p>
      <ul>
        <li>常見症狀：情緒低落、對事物失去興趣、疲倦感</li>
        <li>可能伴隨：自責、空虛感、睡眠與食慾改變</li>
      </ul>
    </section>
